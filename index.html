<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Sultan 3D</title>
  
  <link rel="stylesheet" href="themes.css">
  
  <style>
    :root{--gold:#f4d17b;--line:#bd9548}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at top,#163b29,#06120c 70%);color:#fff;font-family:Arial,sans-serif;min-height:100vh}
    header{text-align:center;padding:14px;background:linear-gradient(120deg,#173d2a,#06120c);border-bottom:2px solid #d7ae53}
    h1{margin:0;color:var(--gold);letter-spacing:2px;font-size:clamp(24px,6vw,36px)}
    .sub{font-size:10px;letter-spacing:2px;margin-top:4px;color:#d9c18a}
    .balance{text-align:center;padding:10px;color:#ffe3a0}.balance strong{display:block;font-size:22px}
    main{max-width:900px;margin:auto;padding:10px}h2{color:var(--gold);font-size:16px}
    .screen{display:none}.screen.active{display:block}
    
    .auth-box{max-width:380px;margin:40px auto;background:linear-gradient(145deg,#204a32,#10291d);border:1px solid var(--line);border-radius:16px;padding:25px;box-shadow:0 10px 30px #000a}
    .auth-field{margin-bottom:15px;text-align:left}
    .auth-field label{display:block;font-size:12px;color:#ffe5a1;margin-bottom:5px}
    .auth-field input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#071810;color:#fff;font-size:14px}
    .auth-btn{width:100%;padding:12px;margin-top:10px;border-radius:8px;font-weight:bold;cursor:pointer;background:linear-gradient(#ffe7a1,#c99535);color:#201606;border:0}
    .auth-alt-btn{width:100%;padding:10px;margin-top:8px;background:transparent;border:1px solid var(--line);color:#ffe5a1;border-radius:8px;cursor:pointer}

    .boards-single{display:flex;flex-direction:column;align-items:center;gap:10px}
    .board-view{width:100%;max-width:340px;margin:auto}
    .card{border-radius:14px;text-align:center;padding:18px 10px;background:linear-gradient(145deg,#204a32,#10291d);border:1px solid var(--line)}
    .card button{width:94%;font-size:12px;margin-top:8px;padding:11px}
    button{border:0;border-radius:8px;background:linear-gradient(#ffe7a1,#c99535);color:#201606;font-weight:bold;padding:9px;cursor:pointer}
    
    /* گیم ارینا اور 3D کونوں والی ڈائس */
    .game-arena-container {
      position: relative;
      width: min(94vw, 420px);
      margin: 25px auto;
      padding: 50px;
    }
    #board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);background:#f6f0d9;border:4px solid #e4bc5e;box-shadow:0 0 22px #d4a83c55;position:relative}
    
    /* 3D گوٹیاں */
    .token {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.7), inset 0 3px 4px rgba(255,255,255,0.6), inset 0 -3px 4px rgba(0,0,0,0.4);
      z-index: 10;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: all 0.4s ease;
    }
    .token.red { background: radial-gradient(circle at 35% 35%, #ff8381, #d63031); }
    .token.green { background: radial-gradient(circle at 35% 35%, #74b9ff, #00b894); }
    .token.yellow { background: radial-gradient(circle at 35% 35%, #ffeaa7, #fdcb6e); }
    .token.blue { background: radial-gradient(circle at 35% 35%, #81ecec, #0984e3); }

    /* چاروں کونوں کی 3D ڈائس */
    .corner-dice-box {
      position: absolute;
      width: 55px;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.35;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 20;
    }
    .corner-dice-box.active-turn {
      opacity: 1;
      pointer-events: auto;
    }
    
    .dice-red-pos   { top: 2px; left: 2px; }
    .dice-green-pos { top: 2px; right: 2px; }
    .dice-yellow-pos{ bottom: 2px; right: 2px; }
    .dice-blue-pos  { bottom: 2px; left: 2px; }

    /* 20 سیکنڈ سرکلر ٹائمر */
    .timer-ring {
      position: absolute;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 3px solid transparent;
      pointer-events: none;
    }
    .active-turn .timer-ring {
      border: 3px solid var(--gold);
      animation: countdown 20s linear infinite;
    }
    @keyframes countdown {
      0% { clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 0%, 50% 0%); }
      100% { clip-path: polygon(50% 50%, 50% 0%, 50% 0%, 50% 0%, 50% 0%, 50% 0%, 50% 0%); }
    }

    .dice-scene {
      width: 40px;
      height: 40px;
      perspective: 400px;
      cursor: pointer;
    }
    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s ease-in-out;
    }
    .face {
      position: absolute;
      width: 40px;
      height: 40px;
      background: linear-gradient(145deg, #fff, #e0e0e0);
      border: 1px solid #bd9548;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
      color: #201606;
    }
    .front  { transform: translateZ(20px); }
    .back   { transform: rotateY(180deg) translateZ(20px); }
    .right  { transform: rotateY(90deg) translateZ(20px); }
    .left   { transform: rotateY(-90deg) translateZ(20px); }
    .top    { transform: rotateX(90deg) translateZ(20px); }
    .bottom { transform: rotateX(-90deg) translateZ(20px); }
    
    .room-topbar{position:relative;height:40px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
    #turn{text-align:center;min-height:30px;color:#ffe4a0;margin:6px 0;font-size:14px;font-weight:bold}
    
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .modal-box {
      background: #10291d; border: 2px solid var(--gold);
      padding: 20px; border-radius: 14px; width: 90%; max-width: 360px;
      text-align: center; color: #fff;
    }
  </style>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>

  <header>
    <h1>LUDO SULTAN</h1>
    <div class="sub">NEW FRESH EDITION</div>
  </header>

  <div class="balance">
    Coins: <strong id="coins">50,000</strong>
  </div>

  <main>
    <!-- لاگ ان اسکرین -->
    <section id="authScreen" class="screen active">
      <div class="auth-box">
        <h2 style="text-align: center; margin-top: 0;">👑 LUDO SULTAN LOGIN</h2>
        <div class="auth-field">
          <label>Email Address</label>
          <input type="email" id="authEmail" placeholder="Enter your email" />
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" id="authPassword" placeholder="Enter password" />
        </div>
        <button class="auth-btn" onclick="startGameDirectly()">LOGIN</button>
        <button class="auth-alt-btn" onclick="startGameDirectly()" style="margin-top: 15px; background: #204a32; border: 1px solid var(--gold); color: var(--gold);">🚀 PLAY NOW (GUEST)</button>
      </div>
    </section>

    <!-- ہوم اسکرین -->
    <section id="home" class="screen">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 10px;">
        <h2>SELECT ARENA</h2>
      </div>
      <div class="boards-single">
        <div class="board-view">
          <div class="card" style="margin-top:20px;">
            <h3>Royal Forest Arena</h3>
            <p>Classic 4 Player Ludo Match</p>
            <button onclick="enterGameRoom()">Start Play</button>
          </div>
        </div>
      </div>
    </section>

    <!-- گیم روم -->
    <section id="arena" class="screen">
      <div class="room-topbar">
        <button onclick="exitToHome()">← Exit Lobby</button>
        <button onclick="newGameReset()" style="background:#2ecc71; color:#fff;">Restart Match</button>
      </div>

      <div id="turn">Turn: Red (Roll 6 to open token)</div>

      <div class="game-arena-container">
        <!-- Red Dice (Top-Left) -->
        <div class="corner-dice-box dice-red-pos active-turn" id="dice-box-0" onclick="rollDiceNew(0)">
          <div class="timer-ring"></div>
          <div class="dice-scene">
            <div id="cube-0" class="cube">
              <div class="face front">1</div><div class="face back">6</div>
              <div class="face right">3</div><div class="face left">4</div>
              <div class="face top">2</div><div class="face bottom">5</div>
            </div>
          </div>
        </div>

        <!-- Green Dice (Top-Right) -->
        <div class="corner-dice-box dice-green-pos" id="dice-box-1" onclick="rollDiceNew(1)">
          <div class="timer-ring"></div>
          <div class="dice-scene">
            <div id="cube-1" class="cube">
              <div class="face front">1</div><div class="face back">6</div>
              <div class="face right">3</div><div class="face left">4</div>
              <div class="face top">2</div><div class="face bottom">5</div>
            </div>
          </div>
        </div>

        <!-- Yellow Dice (Bottom-Right) -->
        <div class="corner-dice-box dice-yellow-pos" id="dice-box-2" onclick="rollDiceNew(2)">
          <div class="timer-ring"></div>
          <div class="dice-scene">
            <div id="cube-2" class="cube">
              <div class="face front">1</div><div class="face back">6</div>
              <div class="face right">3</div><div class="face left">4</div>
              <div class="face top">2</div><div class="face bottom">5</div>
            </div>
          </div>
        </div>

        <!-- Blue Dice (Bottom-Left) -->
        <div class="corner-dice-box dice-blue-pos" id="dice-box-3" onclick="rollDiceNew(3)">
          <div class="timer-ring"></div>
          <div class="dice-scene">
            <div id="cube-3" class="cube">
              <div class="face front">1</div><div class="face back">6</div>
              <div class="face right">3</div><div class="face left">4</div>
              <div class="face top">2</div><div class="face bottom">5</div>
            </div>
          </div>
        </div>

        <!-- لڈو بورڈ اور گوٹیاں -->
        <div id="board" class="theme-forest-arena">
          <!-- سرخ گوٹیاں -->
          <div class="token red" id="red-0" onclick="clickToken('red', 0)" style="top: 15%; left: 15%;"></div>
          <div class="token red" id="red-1" onclick="clickToken('red', 1)" style="top: 15%; left: 25%;"></div>
          <div class="token red" id="red-2" onclick="clickToken('red', 2)" style="top: 25%; left: 15%;"></div>
          <div class="token red" id="red-3" onclick="clickToken('red', 3)" style="top: 25%; left: 25%;"></div>

          <!-- سبز گوٹیاں -->
          <div class="token green" id="green-0" onclick="clickToken('green', 0)" style="top: 15%; right: 15%;"></div>
          <div class="token green" id="green-1" onclick="clickToken('green', 1)" style="top: 15%; right: 25%;"></div>
          <div class="token green" id="green-2" onclick="clickToken('green', 2)" style="top: 25%; right: 15%;"></div>
          <div class="token green" id="green-3" onclick="clickToken('green', 3)" style="top: 25%; right: 25%;"></div>

          <!-- پیلی گوٹیاں -->
          <div class="token yellow" id="yellow-0" onclick="clickToken('yellow', 0)" style="bottom: 15%; right: 15%;"></div>
          <div class="token yellow" id="yellow-1" onclick="clickToken('yellow', 1)" style="bottom: 15%; right: 25%;"></div>
          <div class="token yellow" id="yellow-2" onclick="clickToken('yellow', 2)" style="bottom: 25%; right: 15%;"></div>
          <div class="token yellow" id="yellow-3" onclick="clickToken('yellow', 3)" style="bottom: 25%; right: 25%;"></div>

          <!-- نیلی گوٹیاں -->
          <div class="token blue" id="blue-0" onclick="clickToken('blue', 0)" style="bottom: 15%; left: 15%;"></div>
          <div class="token blue" id="blue-1" onclick="clickToken('blue', 1)" style="bottom: 15%; left: 25%;"></div>
          <div class="token blue" id="blue-2" onclick="clickToken('blue', 2)" style="bottom: 25%; left: 15%;"></div>
          <div class="token blue" id="blue-3" onclick="clickToken('blue', 3)" style="bottom: 25%; left: 25%;"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
