
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUDO SULTAN</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071810;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:18px;background:linear-gradient(120deg,#102d20,#06120c);border-bottom:2px solid #d7ae53}
h1{margin:0;color:#f4d17b;letter-spacing:3px;font-size:clamp(27px,7vw,42px)}
.sub{font-size:11px;letter-spacing:3px;margin-top:7px;color:#d9c18a}
.balance{text-align:center;padding:12px;color:#ffe3a0}
.balance strong{display:block;font-size:23px;margin-top:4px}
main{max-width:850px;margin:auto;padding:12px}
h2{color:#f4d17b;font-size:18px}
.boards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.card{background:linear-gradient(145deg,#204a32,#10291d);border:1px solid #bd9548;border-radius:12px;text-align:center;padding:12px 3px}
.icon{font-size:26px}
.card h3{font-size:12px;color:#ffe5a1;margin:7px 0}
.card p{font-size:11px;color:#d2e0d5}
button{border:0;border-radius:8px;background:linear-gradient(#ffe7a1,#c99535);color:#201606;font-weight:bold;padding:10px;cursor:pointer}
.card button{width:94%;font-size:11px}
button:disabled{background:#49594e;color:#bbb}
#arena{display:none}
#arena.active{display:block}
#lobby.hidden{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}
#board{width:min(94vw,430px);aspect-ratio:1;margin:14px auto;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);background:#f6f0d9;border:4px solid #e4bc5e;box-shadow:0 0 20px #d4a83c40}
.cell{border:1px solid #c8c1a9;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;position:relative;font-size:clamp(7px,2vw,13px)}
.red{background:#e95a58}.green{background:#49b87c}.yellow{background:#f4d14b}.blue{background:#55a4ee}
.base{border:2px solid white}
.homeinner{width:75%;height:75%;background:#fff;border-radius:12%;display:grid;grid-template-columns:1fr 1fr;place-items:center;gap:3px;padding:4px}
.pawn{width:75%;height:75%;border-radius:50%;border:2px solid white;box-shadow:0 2px 3px #3338;cursor:pointer;min-width:3px;min-height:3px}
.pawn.red{background:#e51e28}.pawn.green{background:#148447}.pawn.yellow{background:#f2c51b}.pawn.blue{background:#1674d2}
.track{background:#fffdf3}
.center{background:conic-gradient(#e95a58 0 25%,#49b87c 0 50%,#f4d14b 0 75%,#55a4ee 0);color:#fff;font-size:clamp(8px,2vw,15px);font-weight:bold}
.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:12px}
#die{font-size:44px;text-align:center;margin:10px auto;width:70px;height:70px;display:grid;place-items:center;background:#fff9e7;color:#162519;border-radius:14px;border:3px solid #d6ae4f;box-shadow:0 4px 0 #8d6425}
#die.rolling{animation:roll .65s ease-in-out}
@keyframes roll{0%{transform:rotate(0) scale(1)}25%{transform:rotate(100deg) scale(.8)}55%{transform:rotate(240deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}
#status{text-align:center;min-height:35px;color:#ffe4a0;line-height:1.5}
.small{text-align:center;font-size:11px;color:#aebfb1;line-height:1.6}
@media(min-width:600px){.boards{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{padding:15px 5px}.card h3{font-size:14px}.card p{font-size:12px}}
</style>
</head>
<body>
<header><h1>♛ LUDO SULTAN</h1><div class="sub">THE ROYAL LUDO ARENA</div></header>
<div class="balance">DEMO COINS<strong id="coins">1,000</strong></div>
<main>
<section id="lobby">
<h2>👑 CHOOSE YOUR ARENA</h2>
<div class="boards" id="boards"></div>
<p class="small">Local demo only. No real coin payments or online multiplayer.</p>
</section>
<section id="arena">
<div class="topbar"><strong id="arenaTitle">Classic Arena</strong><button onclick="back()">← All Boards</button></div>
<div id="status">Red player's turn. Roll the dice.</div>
<div id="die">⚄</div>
<div id="board"></div>
<div class="controls"><button onclick="roll()">🎲 ROLL DICE</button><button onclick="resetGame()">↻ NEW GAME</button></div>
<p class="small">Four players · Four tokens each · Local prototype</p>
</section>
</main>
<script>
const levels=[
["Classic",300,"🎲"],["Bronze",500,"🥉"],["Silver",700,"🥈"],
["Golden",1000,"🥇"],["Diamond",2000,"💎"],["Special",5000,"⭐"],
["International",10000,"🌐"],["Master",20000,"👑"],["Underworld",25000,"🌑"],
["Don",30000,"⚔️"],["Don Killer",50000,"🔥"],["Don Boss",100000,"🏆"],
["Legend",150000,"🐉"],["Legend Master",200000,"💠"],
["Legend Boss",250000,"🦁"],["Ludo Sultan",500000,"♛"],["Sultan Boss",1000000,"👑"]
];
const names=["Red","Green","Yellow","Blue"];
const starts=[0,13,26,39];
const safe=[0,8,13,21,26,34,39,47];
const faces=["⚀","⚁","⚂","⚃","⚄","⚅"];
let coins=1000,entry=0,turn=0,dice=0,players=[],gameOver=false;
function fmt(n){return n.toLocaleString("en-US")}
function showCoins(){document.getElementById("coins").textContent=fmt(coins)}
function makeLobby(){
 document.getElementById("boards").innerHTML=levels.map((l,i)=>`
 <div class="card"><div class="icon">${l[2]}</div><h3>${l[0]}</h3>
 <p>Entry ${fmt(l[1])}</p>
 <button ${coins<l[1]?"disabled":""} onclick="openArena(${i})">${coins<l[1]?"🔒 LOCKED":"PLAY"}</button></div>`).join("");
 showCoins();
}
function openArena(i){
 if(coins<levels[i][1])return;
 entry=i;
 document.getElementById("lobby").classList.add("hidden");
 document.getElementById("arena").classList.add("active");
 document.getElementById("arenaTitle").textContent=levels[i][0]+" Arena";
 resetGame();
}
function back(){document.getElementById("arena").classList.remove("active");document.getElementById("lobby").classList.remove("hidden")}
function resetGame(){
 turn=0;dice=0;gameOver=false;
 players=names.map(()=>[-1,-1,-1,-1]);
 drawBoard();setStatus("Red player's turn. Roll the dice.");
 document.getElementById("die").textContent="⚄";
}
function setStatus(s){document.getElementById("status").textContent=s}
function makeCell(r,c){
 const cell=document.createElement("div");cell.className="cell";
 let home=null;
 if(r<6&&c<6)home=0;
 else if(r<6&&c>8)home=1;
 else if(r>8&&c>8)home=2;
 else if(r>8&&c<6)home=3;
 if(home!==null){
  cell.classList.add("base",["red","green","yellow","blue"][home]);
  if((r===1||r===4)&&(c===1||c===4)){
   const inner=document.createElement("div");inner.className="homeinner";
   const token=document.createElement("span");token.className="pawn "+["red","green","yellow","blue"][home];
   inner.appendChild(token);cell.appendChild(inner);
  }
 }else if(r===7&&c===7){
  cell.classList.add("center");cell.textContent="♛";
 }else{
  cell.classList.add("track");
  if((r===6||r===8)&&c>=1&&c<=5)cell.classList.add("red");
  if((c===6||c===8)&&r>=1&&r<=5)cell.classList.add("green");
  if((r===6||r===8)&&c>=9&&c<=13)cell.classList.add("yellow");
  if((c===6||c===8)&&r>=9&&r<=13)cell.classList.add("blue");
 }
 return cell;
}
function drawBoard(){
 const board=document.getElementById("board");board.innerHTML="";
 for(let r=0;r<15;r++)for(let c=0;c<15;c++)board.appendChild(makeCell(r,c));
 // Four actual token markers are shown in each home for every player.
 const homes=[[1,1],[1,9],[9,9],[9,1]];
 homes.forEach(([hr,hc],p)=>{
  for(let t=0;t<4;t++){
   const cell=board.children[(hr+(t>>1)*3)*15+hc+(t%2)*3];
   if(cell){cell.innerHTML="";const pawn=document.createElement("span");pawn.className="pawn "+["red","green","yellow","blue"][p];cell.appendChild(pawn)}
  }
 });
}
function legalMoves(){
 return players[turn].map((p,i)=>({p,i})).filter(x=>x.p===-1?dice===6:x.p+dice<=57).map(x=>x.i);
}
function roll(){
 if(gameOver)return;
 if(dice){setStatus("Choose a token first.");return}
 const die=document.getElementById("die");
 die.classList.remove("rolling");void die.offsetWidth;die.classList.add("rolling");
 setTimeout(()=>{
  dice=1+Math.floor(Math.random()*6);die.textContent=faces[dice-1];
  const moves=legalMoves();
  if(!moves.length){setStatus(names[turn]+" rolled "+dice+". No legal move; turn passes.");dice=0;turn=(turn+1)%4;return}
  const token=moves[0];
  players[turn][token]=players[turn][token]===-1?0:players[turn][token]+dice;
  const moved=names[turn],rolled=dice;
  if(players[turn].every(p=>p===57)){gameOver=true;drawBoard();setStatus(moved+" wins!");dice=0;return}
  dice=0;if(rolled!==6)turn=(turn+1)%4;
  drawBoard();setStatus(moved+" moved token "+(token+1)+". "+names[turn]+"'s turn.");
 },650);
}
makeLobby();
</script>
</body>
</html>
