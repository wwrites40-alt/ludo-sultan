<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Sultan - Fancy Arenas</title>
  <!-- لنک تھیمز سی ایس ایس -->
  <link rel="stylesheet" href="themes.css">
</head>
<body>

  <!-- ہیڈر سیکشن -->
  <header>
    <h1>LUDO SULTAN</h1>
    <div class="sub">SULTAN OF THE BOARD</div>
  </header>

  <!-- بیلنس بار -->
  <div class="balance">
    Coins: <strong id="userCoins">50,000</strong>
    <span id="sellUnlockBadge">VIP UNLOCKED</span>
  </div>

  <main>
    <!-- ہوم اسکرین / ارینا سلیکشن اسکرین (سوائپ سسٹم کے ساتھ) -->
    <section id="arenaSelection" class="screen active">
      <h2>SELECT ARENA</h2>
      
      <!-- سوائپ ایبل بورڈ / ارینا ویو -->
      <div class="boards-single">
        <div class="board-view">
          <div id="arenaSwipeContainer" style="display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 15px; scrollbar-width: none; padding: 10px 0;">
            <!-- ارینا کارڈز جاوا اسکرپٹ یا ڈائنامک لوڈ ہوں گے، یہاں مثال کے طور پر پہلا کارڈ -->
            <div class="card style-0" style="min-width: 100%; scroll-snap-align: center;">
              <div class="icon" id="icon-forest-arena" style="width: 64px; height: 64px; margin: 0 auto;"></div>
              <h3>Forest Arena</h3>
              <p>Entry: 50 Coins</p>
              <button onclick="enterArena('forest-arena', 50, 0)">Play Forest</button>
            </div>
          </div>
        </div>

        <!-- پیج / سلائیڈ انڈیکیٹرز -->
        <div class="board-nav" id="arenaDots">
          <!-- یہاں ڈاٹس آئیں گے -->
        </div>
      </div>
    </section>

    <!-- گیم روم / ارینا بورڈ اسکرین -->
    <section id="arena" class="screen">
      <div class="room-topbar">
        <div class="room-menu-btn" onclick="toggleRoomMenu()">⋮</div>
        <div class="room-menu-dropdown" id="roomMenuDropdown">
          <button onclick="leaveRoom()">Exit to Lobby</button>
        </div>
      </div>

      <div id="status">Waiting for player turn...</div>

      <!-- لڈو بورڈ اور فینسی بیک گراؤنڈ روٹ -->
      <div class="board-wrapper">
        <div id="board" class="theme-forest-arena">
          <!-- 15x15 لڈو بورڈ سیلز -->
          <div class="cell base red"></div>
          <div class="cell base green"></div>
          <div class="cell base yellow"></div>
          <div class="cell base blue"></div>
          <div class="cell center">HOME</div>
        </div>
      </div>

      <!-- تھری ڈی ڈائس اور ٹائمر سیکشن -->
      <div class="dice-below">
        <div class="dice-pos red active">
          <b>RED PLAYER</b>
          <div class="dice-timer-wrap">
            <svg>
              <circle class="timer-circle-bg" cx="39" cy="39" r="36"></circle>
              <circle class="timer-circle" id="timerCircle" cx="39" cy="39" r="36"></circle>
            </svg>
            <div class="die" id="dieElement">
              <div class="pipface">
                <div class="pip"></div><div class="pip"></div><div class="pip"></div>
                <div class="pip"></div><div class="pip on"></div><div class="pip"></div>
                <div class="pip"></div><div class="pip"></div><div class="pip"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ضروری اسکرپٹس -->
  <script src="svg-icons.js"></script>
  <script>
    // اسکرین تبدیل کرنے کا فنکشن
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    // روم میں داخل ہونے اور تھیم سیٹ کرنے کا فنکشن
    function enterArena(arenaName, entryFee, styleIndex) {
      showScreen('arena');
      const board = document.getElementById('board');
      // بورڈ کی پرانی تھیم کلاس ہٹا کر نئی تھیم لگانا
      board.className = '';
      board.classList.add(`theme-${arenaName}`);
      document.getElementById('status').innerText = `Entered ${arenaName.replace('-', ' ').toUpperCase()}! Good Luck.`;
    }

    // روم سے باہر نکلنے کا فنکشن
    function leaveRoom() {
      showScreen('arenaSelection');
    }

    // روم مینو ڈراپ ڈاؤن ٹوگل
    function toggleRoomMenu() {
      document.getElementById('roomMenuDropdown').classList.toggle('show');
    }

    // صفحہ لوڈ ہوتے ہی SVG آئیکنز کو ان کے متعلقہ کنٹینر میں رینڈر کرنا
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof ArenaSvgIcons !== 'undefined') {
        const iconContainer = document.getElementById('icon-forest-arena');
        if (iconContainer && ArenaSvgIcons['forest-arena']) {
          iconContainer.innerHTML = ArenaSvgIcons['forest-arena'];
        }
      }
    });
  </script>
</body>
</html>
